name: Build and Push OpenCodex to GHCR

on:
  push:
    tags:
      - 'v*' 

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lidge-jun/opencodex Repo
        uses: actions/checkout@v4
        with:
          repository: lidge-jun/opencodex
          ref: 'dev'
          path: ./opencodex-src
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./opencodex-src
          file: ./opencodex-src/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opencodex:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/opencodex:latest
