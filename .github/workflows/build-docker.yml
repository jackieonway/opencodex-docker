name: Build OpenCodex Docker

on:
  push:
    tags:
      - 'v*'  # 当你在当前仓库推送以 v 开头的 Tag 时触发（例如 v1.0.0）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repo (Dockerfile)
        uses: actions/checkout@v4
        with:
          path: ./current-repo

      - name: Checkout lidge-jun/opencodex Repo
        uses: actions/checkout@v4
        with:
          repository: lidge-jun/opencodex
          ref: ${{ github.ref_name }}  # 动态匹配你当前打的 Tag，或者改为 'dev'
          path: ./opencodex-src        # 存放到临时子目录中

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./opencodex-src/Dockerfile   
          push: true
          tags: |
            jackieonway/opencodex:${{ github.ref_name }}
            jackieonway/opencodex:latest
